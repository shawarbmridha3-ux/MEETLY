        const SizedBox(height: 8),
        const Text('Meet new people and make new connections.'),
        const SizedBox(height: 20),
        Container(
          padding: const EdgeInsets.all(20),
          decoration: BoxDecoration(
            color: surface,
            borderRadius: BorderRadius.circular(24),
          ),
          child: const Column(
            crossAxisAlignment: CrossAxisAlignment.start,
            children: [
              Icon(Icons.people_alt, size: 45),
              SizedBox(height: 12),
              Text(
                'Discover People',
                style: TextStyle(
                  fontSize: 22,
                  fontWeight: FontWeight.bold,
                ),
              ),
              SizedBox(height: 6),
              Text('Find interesting people and start a conversation.'),
            ],
          ),
        ),
        const SizedBox(height: 16),
        const FeatureCard(
          icon: Icons.live_tv,
          title: 'Live',
          subtitle: 'Join live rooms',
        ),
        const FeatureCard(
          icon: Icons.shuffle,
          title: 'Random Match',
          subtitle: 'Find someone new',
        ),
        const FeatureCard(
          icon: Icons.diamond,
          title: 'VIP',
          subtitle: 'Unlock premium features',
        ),
      ],
    );
  }
}

class FeatureCard extends StatelessWidget {
  final IconData icon;
  final String title;
  final String subtitle;

  const FeatureCard({
    super.key,
    required this.icon,
    required this.title,
    required this.subtitle,
  });

  @override
  Widget build(BuildContext context) {
    return Card(
      child: ListTile(
        leading: CircleAvatar(
          child: Icon(icon),
        ),
        title: Text(
          title,
          style: const TextStyle(fontWeight: FontWeight.bold),
        ),
        subtitle: Text(subtitle),
        trailing: const Icon(Icons.arrow_forward_ios, size: 16),
      ),
    );
  }
}

