import 'package:flutter/material.dart';

void main() {
  runApp(const MeetlyApp());
}

class MeetlyApp extends StatefulWidget {
  const MeetlyApp({super.key});

  @override
  State<MeetlyApp> createState() => _MeetlyAppState();
}

class _MeetlyAppState extends State<MeetlyApp> {
  ThemeMode themeMode = ThemeMode.light;

  void toggleTheme() {
    setState(() {
      themeMode =
          themeMode == ThemeMode.dark : ThemeMode.light;
    });
  }
  @override
  Widget build(BuildContext context) {
    return MaterialApp(
      debugShowCheckedModeBanner: false,
      title: 'MEETLY',
      themeMode: themeMode,
      theme: ThemeData(
        brightness: Brightness.light,
        colorSchemeSeed: Colors.lightBlue,
        useMaterial3: true,
      ),
      darkTheme: ThemeData(
        brightness: Brightness.dark,
        colorSchemeSeed: Colors.lightBlue,
        useMaterial3: true,
      ),
      home: MeetlyHome(
        isDark: themeMode == ThemeMode.dark,
        onThemeChanged: toggleTheme,
      ),
    );
  }
}

class MeetlyHome extends StatefulWidget {
  final bool isDark;
  final VoidCallback onThemeChanged;

  const MeetlyHome({
    super.key,
    required this.isDark,
    required this.onThemeChanged,
  });

  @override
  State<MeetlyHome> createState() => _MeetlyHomeState();
}

class _MeetlyHomeState extends State<MeetlyHome> {
  int selectedIndex = 0;

  final pages = const [
    HomePage(),
    LivePage(),
    MatchPage(),
    ProfilePage(),
  ];

  @override
  Widget build(BuildContext context) {
    return Scaffold(
      appBar: AppBar(
        title: const Text(
          'MEETLY',
          style: TextStyle(fontWeight: FontWeight.bold),
        ),
        actions: [
          IconButton(
            onPressed: widget.onThemeChanged,
            icon: Icon(
              widget.isDark ? Icons.light_mode : Icons.dark_mode,
            ),
          ),
        ],
      ),
      body: pages[selectedIndex],
      bottomNavigationBar: NavigationBar(
        selectedIndex: selectedIndex,
        onDestinationSelected: (index) {
          setState(() {
            selectedIndex = index;
          });
        },
        destinations: const [
          NavigationDestination(
            icon: Icon(Icons.home_outlined),
            selectedIcon: Icon(Icons.home),
            label: 'Home',
          ),
          NavigationDestination(
            icon: Icon(Icons.live_tv_outlined),
            selectedIcon: Icon(Icons.live_tv),
            label: 'Live',
          ),
          NavigationDestination(
            icon: Icon(Icons.shuffle_outlined),
            selectedIcon: Icon(Icons.shuffle),
            label: 'Match',
          ),
          NavigationDestination(
            icon: Icon(Icons.person_outline),
            selectedIcon: Icon(Icons.person),
            label: 'Profile',
          ),
        ],
      ),
    );
  }
}

